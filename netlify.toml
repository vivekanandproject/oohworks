# How Netlify builds and runs ohworks. The app is the Next.js project in apps/web.
#
# This is a preview, not the production home: the plan of record is Google Cloud Run with Cloud SQL
# (docs/ohworks-build-plan.md). Here the site runs on Netlify's functions with Netlify's own Postgres.
#
# What Netlify must provide, and nothing here can: a database. The build stops with a plain message
# if there is none. See docs/ohworks-netlify-preview.md.

[build]
  base = "apps/web"
  command = "pnpm run build:hosted"
  publish = ".next"

[build.environment]
  NODE_VERSION = "22"
  NEXT_TELEMETRY_DISABLED = "1"
  # A preview shows the sample pieces and sample sites, each labelled as a sample and never indexed.
  SAMPLE_DATA = "allow"
  HUB_PREVIEW = "1"
  # Netlify keeps no files between requests, so pictures made at build time are served as plain files.
  HOSTED_MEDIA = "static"

[[plugins]]
  package = "@netlify/plugin-nextjs"
