# Deploys to Google Cloud Run: `main` to staging, a tag `v*` to production.
# Parked here with the CI workflow until a GitHub token may push files under .github/workflows/.
#
# Needs, from `terraform output` in infra/terraform/envs/shared (see infra/terraform/README.md):
#   secrets  GCP_WORKLOAD_IDENTITY_PROVIDER, GCP_DEPLOY_SERVICE_ACCOUNT
#   vars     GCP_SHARED_PROJECT, GCP_STAGING_PROJECT, GCP_PROD_PROJECT
# The `production` GitHub environment can require a person to approve each production deploy.

name: deploy

on:
  push:
    branches: [main]
    tags: ["v*"]

permissions:
  contents: read
  id-token: write

concurrency:
  group: deploy-${{ startsWith(github.ref, 'refs/tags/v') && 'production' || 'staging' }}
  cancel-in-progress: false

env:
  REGION: asia-south1

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: ${{ startsWith(github.ref, 'refs/tags/v') && 'production' || 'staging' }}
    steps:
      - uses: actions/checkout@v4

      - name: Choose the environment
        id: target
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "name=production" >> "$GITHUB_OUTPUT"
            echo "project=${{ vars.GCP_PROD_PROJECT }}" >> "$GITHUB_OUTPUT"
            echo "site=https://ohworks.com" >> "$GITHUB_OUTPUT"
          else
            echo "name=staging" >> "$GITHUB_OUTPUT"
            echo "project=${{ vars.GCP_STAGING_PROJECT }}" >> "$GITHUB_OUTPUT"
            echo "site=https://staging.ohworks.com" >> "$GITHUB_OUTPUT"
          fi
          echo "registry=$REGION-docker.pkg.dev/${{ vars.GCP_SHARED_PROJECT }}/ohworks" >> "$GITHUB_OUTPUT"
          echo "tag=${GITHUB_SHA::12}-$( [[ "$GITHUB_REF" == refs/tags/v* ]] && echo production || echo staging )" >> "$GITHUB_OUTPUT"

      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_DEPLOY_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@v2
      - run: gcloud auth configure-docker "$REGION-docker.pkg.dev" --quiet
      - uses: docker/setup-buildx-action@v3

      - name: Build and push the web and release images
        env:
          REGISTRY: ${{ steps.target.outputs.registry }}
          TAG: ${{ steps.target.outputs.tag }}
          SITE: ${{ steps.target.outputs.site }}
        run: |
          docker buildx build --push --build-arg NEXT_PUBLIC_SITE_URL="$SITE" \
            --cache-from type=gha --cache-to type=gha,mode=max \
            -t "$REGISTRY/web:$TAG" .
          docker buildx build --push --build-arg NEXT_PUBLIC_SITE_URL="$SITE" --target release \
            --cache-from type=gha \
            -t "$REGISTRY/release:$TAG" .

      - name: Prepare the database (migrations, first users)
        env:
          PROJECT: ${{ steps.target.outputs.project }}
          IMAGE: ${{ steps.target.outputs.registry }}/release:${{ steps.target.outputs.tag }}
        run: |
          gcloud run jobs update release --image "$IMAGE" --region "$REGION" --project "$PROJECT"
          gcloud run jobs execute release --wait --region "$REGION" --project "$PROJECT"

      - name: Deploy
        env:
          PROJECT: ${{ steps.target.outputs.project }}
          NAME: ${{ steps.target.outputs.name }}
          IMAGE: ${{ steps.target.outputs.registry }}/web:${{ steps.target.outputs.tag }}
        run: |
          if [ "$NAME" = staging ]; then
            gcloud run deploy web --image "$IMAGE" --region "$REGION" --project "$PROJECT" --quiet
            exit 0
          fi
          # Production: the new revision takes 10% of traffic, is checked, then takes it all.
          gcloud run deploy web --image "$IMAGE" --region "$REGION" --project "$PROJECT" \
            --no-traffic --tag candidate --quiet
          URL=$(gcloud run services describe web --region "$REGION" --project "$PROJECT" \
            --format='value(status.traffic[].url)' | tr ';' '\n' | grep candidate | head -1)
          for i in $(seq 1 20); do curl -sf "$URL/api/health/" && break; sleep 6; done
          curl -sf "$URL/api/health/" > /dev/null
          gcloud run services update-traffic web --to-tags candidate=10 \
            --region "$REGION" --project "$PROJECT" --quiet
          sleep 300
          gcloud run services update-traffic web --to-latest \
            --region "$REGION" --project "$PROJECT" --quiet
          # Rolling back is one command: gcloud run services update-traffic web --to-revisions=<previous>=100
